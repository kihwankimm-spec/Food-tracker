<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuel">
<meta name="theme-color" content="#0C1620">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Mexico Fuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a dark gym logbook. Scoreboard-style condensed numerals carry the personality;
   the current phase colour (teal / orange / red / gold) tints every accent so the app always tells you where you are. */
:root{
  --bg:#0C1620;
  --surface:#132230;
  --surface-2:#1A2C3D;
  --line:#243A4E;
  --text:#ECF2F6;
  --muted:#8EA2B2;
  --phase:#19A7A9;
  --phase-ink:#04201F;
  --good:#5BC98B;
  --warn:#E9B44C;
  --bad:#E5684E;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--text)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--phase);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 92px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 12px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.brand span{color:var(--phase)}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600}
.chip.phase{background:var(--phase);color:var(--phase-ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:700;font-size:16px;background:var(--surface-2)}
.btn.primary{background:var(--phase);color:var(--phase-ink)}
.btn.danger{background:rgba(229,104,78,.15);color:var(--bad)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:18px;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line)}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:var(--phase);opacity:.12}
.weekbig{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9;letter-spacing:-.01em}
.weekbig small{font-size:22px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.targets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.tgt{background:rgba(255,255,255,.04);border-radius:10px;padding:8px 10px}
.tgt b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.tgt span{font-size:12px;color:var(--muted)}

/* Week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dayc{border-radius:10px;background:var(--surface-2);padding:8px 2px;text-align:center;min-height:62px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:4px}
.dayc .d{font-size:11px;color:var(--muted);font-weight:600}
.dayc .k{font-family:var(--display);font-weight:700;font-size:16px;line-height:1}
.dayc.lift .k{color:var(--phase)}
.dayc.today{outline:2px solid var(--phase)}
.dayc.done{background:var(--phase);color:var(--phase-ink)}
.dayc.done .k,.dayc.done .d{color:var(--phase-ink)}

/* Workout list cards */
.wcard{display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--phase)}
.wtitle{font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.exlist{display:flex;flex-direction:column;gap:4px;font-size:14px}
.exlist div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:5px 0}
.exlist div:last-child{border-bottom:0}
.exlist span:last-child{font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap}
.donebadge{font-size:12px;font-weight:700;color:var(--good)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--phase);border-radius:99px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(12,22,32,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--phase)}

/* Active workout */
.wk{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.wk-in{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 130px)}
.wkhead{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 4px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.clock{font-family:var(--display);font-weight:700;font-size:22px;color:var(--phase)}
.exc{background:var(--surface);border-radius:var(--r);padding:14px 12px;margin-top:12px}
.exname{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05}
.exmeta{font-size:13px;color:var(--muted);margin-top:4px}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tag.C{color:#9CC9FF}
.tag.I{color:var(--warn)}
.tag.TOP{color:var(--bad)}
.hint{margin-top:8px;font-size:13px;padding:7px 10px;border-radius:9px;background:rgba(255,255,255,.04)}
.hint b{color:var(--phase)}
.sets{margin-top:10px;display:grid;grid-template-columns:34px 1fr 74px 60px 50px 44px;gap:6px;align-items:center}
.sets .h{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.sn{font-family:var(--display);font-weight:700;font-size:16px;text-align:center;border-radius:8px;padding:6px 0;background:var(--surface-2)}
.sn.Top{background:rgba(229,104,78,.2);color:var(--bad);font-size:12px}
.sn.Back{font-size:12px}
.sn.Drop{background:rgba(233,180,76,.18);color:var(--warn);font-size:12px}
.prev{font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in{width:100%;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--bg);text-align:center;font-family:var(--display);font-weight:700;font-size:20px;padding:0 4px}
.in::placeholder{color:#4F6476}
.in.rpe{font-size:16px}
.chk{height:44px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.chk svg{width:22px;height:22px}
.setrow.done .in{border-color:transparent;background:rgba(91,201,139,.12)}
.setrow.done .chk{background:var(--good);color:#06210F}
.setrow{display:contents}
.exfoot{display:flex;gap:8px;margin-top:10px}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:var(--surface-2);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .25s ease}
.restbar.show{transform:none}
.restbar.over{background:var(--phase);color:var(--phase-ink)}
.restin{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.restt{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;min-width:96px}
.restp{height:5px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}
.restp i{display:block;height:100%;background:var(--phase)}
.restbar.over .restp i{background:var(--phase-ink)}

/* Sheets */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
.sheet h2{font-family:var(--display);font-size:28px;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:40px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface-2);color:var(--text)}

/* Charts + history */
.chart{width:100%;height:auto;display:block}
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.htitle{font-family:var(--display);font-weight:700;font-size:20px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.pr{color:var(--warn);font-weight:700;font-size:12px}
.status{border-radius:12px;padding:10px 12px;font-size:14px}
.status.good{background:rgba(91,201,139,.12);color:var(--good)}
.status.warn{background:rgba(233,180,76,.12);color:var(--warn)}
.status.bad{background:rgba(229,104,78,.12);color:var(--bad)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.planrow{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.planrow:last-child{border-bottom:0}
.pw{font-family:var(--display);font-weight:800;font-size:22px;text-align:center;border-radius:8px;padding:2px 0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);z-index:90;background:var(--surface-2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.erow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.erow:last-of-type{border-bottom:0}
.erow>span:first-child{display:flex;flex-direction:column;min-width:0}
.en{font-weight:600;line-height:1.25}
.ek{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.ek b{font-size:22px;line-height:1}
.frow{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .erow{flex:1;min-width:0;border-bottom:0}
.ib{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:15px;color:var(--phase)}
.star{flex:none;width:34px;height:40px;font-size:22px;line-height:1;color:var(--muted);display:grid;place-items:center}
.star.on{color:var(--warn)}
.star.big{width:44px;height:44px;font-size:28px;border-radius:12px;background:var(--surface-2)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tg{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.tg.ok{background:rgba(91,201,139,.15);color:var(--good)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar.thin{height:5px}
.search{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:17px}
.chips{gap:8px;overflow-x:auto;margin:12px -12px 0;padding:0 12px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.chipb.sm{padding:6px 12px;font-size:13px;background:transparent;border:1px solid var(--line)}
.chipb.on{background:var(--phase);color:var(--phase-ink);border-color:transparent}
#addsubs .chips{display:flex}
.guide h3{font-family:var(--display);font-size:20px;font-weight:700;margin:16px 0 6px}
.guide ol,.guide ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.guide li{line-height:1.4}
.ta{width:100%;height:200px;border-radius:12px;background:var(--bg);color:var(--text);border:1px solid var(--line);padding:10px;font-size:16px}
button.sync{font-size:12px}
.tbtn{text-align:left;display:block;width:100%;padding:0}
.pen{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--phase);font-size:10.5px;letter-spacing:.04em;vertical-align:1px}
.rseg{grid-auto-columns:1fr}
.rseg::-webkit-scrollbar{display:none}
.rseg button{padding:0 4px;font-size:14px;white-space:nowrap;min-width:0}
.rbody{display:block;width:100%;text-align:left;padding:0}
.mstat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mstat div{background:var(--surface-2);border-radius:10px;padding:8px 6px;text-align:center;min-width:0}
.mstat b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.mstat span{font-size:11px;color:var(--muted)}
.ing{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.ing>b{flex:none;width:62px;font-size:18px;line-height:1.2;color:var(--phase)}
.ing>span{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.gi{display:flex;gap:10px;align-items:center;width:100%;padding:10px 0;border-bottom:1px solid var(--line)}
.gi:last-child{border-bottom:0}
.gi>span>span{display:block}
.gi b{flex:none;max-width:46%}
.ck{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--phase-ink)}
.gi.got .ck{background:var(--phase);border-color:transparent}
.gi.got .en,.gi.got b{text-decoration:line-through;color:var(--muted)}
.iconbtn.sm{width:34px;height:34px;border-radius:10px;font-size:18px}
/* Never let iPhone zoom in on a text box: every input is at least 16px. Keep the page exactly one screen wide. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{max-width:100%;overflow-x:hidden}
input,select,textarea{font-size:16px}
#app,.wk-in,.sheet{max-width:100vw}
.field{min-width:0}
.field input,.field select,.field textarea{width:100%;min-width:0;box-sizing:border-box}
</style>
</head>

<nav class="tabs" id="tabs"></nav>
<div id="wk"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const daysBetween=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/86400000);

function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function toast(msg){const t=$("#toast");t.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(toast._t);toast._t=setTimeout(()=>t.innerHTML="",2000);}
function niceDate(s){const t=ymd(new Date());if(s===t)return "Today";if(s===addDays(t,-1))return "Yesterday";if(s===addDays(t,1))return "Tomorrow";
  return parseYmd(s).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});}

    .concat(S.foods.map(f=>Object.assign({cat:"mine",kr:"",est:false},f)));
}
function allFoods(){return baseFoods().map(f=>{const o=S.over[f.id];return o?Object.assign(f,o,{edited:true}):f;});}

function servings(f){return f.unit==="meal"?f.sv:f.sv.concat([["100 g",100],["Grams",1]]);}
function recipeOf(f){return RECIPES[f.rec]||RECIPES[RECALIAS[f.name]]||RECIPES[f.name]||null;}
function isFav(id){return S.favs.includes(id);}
function mealTarget(date,meal){const t=targets(date).kcal, sp=S.settings.split||[25,30,30,15];return Math.round(t*sp[MEALS.indexOf(meal)]/100/5)*5;}

function macrosFor(f,g){return {kcal:f.k*g/100,p:f.p*g/100,c:f.c*g/100,f:f.f*g/100};}

function weekOf(date){const d=daysBetween(S.settings.start,date);if(d<0)return 1;return Math.min(16,Math.floor(d/7)+1);}
function phaseOf(w){return w<=6?1:w<=10?2:w<=14?3:w===15?4:3;}
function targets(date){
  const o=(S.settings.dayT||{})[date]; if(o)return {kcal:o[0],p:o[1],c:o[2],f:o[3]};
  if(S.settings.mode==="custom"){const c=S.settings.custom;return {kcal:c[0],p:c[1],c:c[2],f:c[3]};}
  const w=weekOf(date), wt=getWT(); let t=wt[1];
  [1,6,7,11,15,16].forEach(k=>{if(w>=k)t=wt[k];});
  let [kcal,p,c,f]=t;
  if(w===15){const dow=parseYmd(date).getDay(); if(dow===5||dow===6){c+=60;kcal+=240;}}
  return {kcal,p,c,f};
}
function entries(date){return S.log[date]||[];}
function totals(list){return list.reduce((t,e)=>({kcal:t.kcal+e.kcal,p:t.p+e.p,c:t.c+e.c,f:t.f+e.f}),{kcal:0,p:0,c:0,f:0});}
function addEntry(date,meal,e){(S.log[date]=S.log[date]||[]).push(Object.assign({id:uid(),meal},e));save.log();}
function entryFromFood(f,g,label,q){const m=macrosFor(f,g);const e={fid:f.id,name:f.name,g,sl:label,q,kcal:m.kcal,p:m.p,c:m.c,f:m.f};if(f.unit==="meal")e.u="meal";return e;}
function recentFoods(){
  const count={}, last={}; const dates=Object.keys(S.log).sort().slice(-30);

}

function ring(eaten,target){
  const left=target-eaten, over=left<0, pct=Math.min(1,eaten/target), r=62, C=2*Math.PI*r;
  return `<svg viewBox="0 0 160 160" width="150" height="150" role="img" aria-label="${R(eaten)} of ${target} calories">
    <circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="14"/>
    <circle cx="80" cy="80" r="${r}" fill="none" stroke="${over?"var(--bad)":"var(--phase)"}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" transform="rotate(-90 80 80)"/>
    <text x="80" y="80" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-weight="800" font-size="40" fill="var(--text)">${Math.abs(R(left)).toLocaleString()}</text>
    <text x="80" y="102" text-anchor="middle" font-size="13" fill="${over?"var(--bad)":"var(--muted)"}">${over?"kcal over":"kcal left"}</text></svg>`;
}
function mbar(label,val,tgt,color,isMin){
  const pct=Math.min(100,100*val/tgt), left=tgt-val;
  return `<div><div class="row between" style="margin-bottom:4px"><span style="font-weight:700">${label}</span><span class="small"><b class="num" style="font-size:18px">${R(val)}</b><span class="muted"> / ${tgt} g</span></span></div>
    <div class="bar"><i style="width:${pct}%;background:${color}"></i></div>
    <div class="small muted" style="margin-top:3px">${left>0?R(left)+" g "+(isMin?"to go":"left"):(isMin?"Target hit":R(-left)+" g over")}</div></div>`;
}

    <div class="small muted">${(S.settings.dayT||{})[d]?"Edited for this day":S.settings.mode==="custom"?"Custom targets":(w>15?"March":"Week "+w)+" &middot; "+ph[2]}</div></button>

      </div></div>
    <div class="stack" style="margin-top:14px;gap:12px">
      ${mbar("Protein",tot.p,t.p,"var(--phase)",true)}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">${mbar("Carbs",tot.c,t.c,"#E9B44C")}${mbar("Fat",tot.f,t.f,"#E9844D")}</div>
    </div></section>`;
  MEALS.forEach(m=>{
    const items=list.filter(e=>e.meal===m), mt=totals(items), sug=mealTarget(d,m), over=mt.kcal>sug*1.1, pct=Math.min(100,100*mt.kcal/sug);

      <div class="small muted" style="margin-bottom:4px">${mt.kcal===0?"Suggested about "+sug+" kcal":over?R(mt.kcal-sug)+" kcal over the suggestion. No problem, balance it in another meal.":R(sug-mt.kcal)+" kcal left for "+m.toLowerCase()}${items.length?" &middot; "+R(mt.p)+" g protein":""}</div>

  });

/* ===================== ADD FOOD ===================== */
function openAdd(meal){S.add={meal,q:"",sub:"all",cat:S.favs.length?"favs":recentFoods().length?"recent":"set"};renderAdd();}
function closeAdd(){S.add=null;$("#wk").innerHTML="";document.body.style.overflow="";render();}
function addList(){
  const a=S.add, q=a.q.trim().toLowerCase();
  if(q){return {foods:allFoods().filter(f=>(f.name+" "+f.kr+" "+(f.inc||"")).toLowerCase().includes(q)).slice(0,60),meals:mealList().filter(m=>m.name.toLowerCase().includes(q)),quick:S.quick.filter(x=>x.name.toLowerCase().includes(q))};}
  if(a.cat==="favs") return {foods:S.favs.map(foodById).filter(Boolean),meals:[]};
  if(a.cat==="recent") return {foods:recentFoods(),meals:[]};
  if(a.cat==="quick") return {foods:[],meals:[],quick:S.quick};
  if(a.cat==="build") return {foods:[],meals:mealList()};
  if(a.cat==="set"){const slot=a.meal[0];return {foods:allFoods().filter(f=>f.cat==="set"&&(a.sub==="all"||f.type===a.sub)).sort((x,y)=>(y.slots.includes(slot)?1:0)-(x.slots.includes(slot)?1:0)),meals:[]};}
  return {foods:allFoods().filter(f=>f.cat===a.cat),meals:[]};
}
function mealList(){
  const pre=PRESETS.map(([name,items])=>({id:"p_"+name,name,preset:true,items:items.map(([fid,g])=>{const f=foodById(fid);return entryFromFood(f,g,"Grams",g);})}));

}

function backupData(){return {app:"mexico-fuel",version:3,exported:new Date().toISOString(),settings:S.settings,log:S.log,foods:S.foods,meals:S.meals,favs:S.favs,over:S.over,quick:S.quick,groc:S.groc};}
function markBackup(){S.settings.lastBackup=new Date().toISOString();save.settings();render();}
async function exportShare(){
  const txt=JSON.stringify(backupData()), name="mexico-fuel-backup-"+ymd(new Date())+".json";
  try{const file=new File([txt],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Mexico Fuel backup"});markBackup();closeSheet();toast("Backup saved");return;}
  }catch(e){if(e&&e.name==="AbortError")return;}
  try{const url=URL.createObjectURL(new Blob([txt],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);markBackup();closeSheet();toast("Backup downloaded");}
  catch(e){toast("Could not save. Use Copy backup as text.");}
}
async function exportCopy(){
  const txt=JSON.stringify(backupData());
  try{await navigator.clipboard.writeText(txt);markBackup();closeSheet();toast("Copied. Paste it into Notes.");}
  catch(e){openSheet(`<h2>Copy this backup</h2><p class="small muted">Select all, copy, and paste it into Notes.</p><textarea readonly class="ta">${esc(txt)}</textarea><button class="btn primary block" data-a="closeSheet" style="margin-top:10px">Done</button>`);markBackup();}
}
function restoreFrom(txt){
  let d;try{d=JSON.parse(txt);}catch(e){toast("That is not a valid backup");return;}
  if(!d||d.app!=="mexico-fuel"){toast("That is not a Mexico Fuel backup");return;}
  const days=Object.keys(d.log||{}).length;
  sheetConfirm("Restore backup?","Adds "+days+" days of diary, "+(d.foods||[]).length+" custom foods and "+(d.meals||[]).length+" saved meals. Days in the backup replace the same days on this phone.","Restore",()=>{
    S.log=Object.assign({},S.log,d.log||{});save.log();
    const byId=(cur,inc)=>{const m=new Map(cur.map(x=>[x.id,x]));(inc||[]).forEach(x=>x&&x.id&&m.set(x.id,x));return [...m.values()];};
    S.foods=byId(S.foods,d.foods);save.foods();S.meals=byId(S.meals,d.meals);save.meals();
    S.favs=[...new Set(S.favs.concat(d.favs||[]))];save.favs();S.over=Object.assign({},S.over,d.over||{});save.over();
    (d.quick||[]).slice().reverse().forEach(x=>{if(!S.quick.some(y=>y.name.toLowerCase()===x.name.toLowerCase()))S.quick.push(x);});save.quick();
    if(d.groc&&d.groc.sel){S.groc=Object.assign({sel:{},got:{}},d.groc);save.groc();}
    if(d.settings){S.settings=Object.assign({},S.settings,d.settings,{lastBackup:S.settings.lastBackup||d.exported});save.settings();}
    render();toast("Backup restored");});
}

/* ===================== TRENDS ===================== */
function viewTrends(){
  const today=ymd(new Date()), days=[];
  for(let i=6;i>=0;i--){const d=addDays(today,-i),t=targets(d),tot=totals(entries(d));days.push({d,t,tot,logged:entries(d).length>0});}
  const lg=days.filter(x=>x.logged);
  let h=`<h1 class="num" style="font-size:34px;font-weight:800;margin-bottom:12px">Last 7 days</h1>`;
  if(!lg.length) return h+`<div class="card empty">Log a few days and your averages show up here.</div>`;
  const avg=k=>lg.reduce((s,x)=>s+x.tot[k],0)/lg.length;
  const avgT=lg.reduce((s,x)=>s+x.t.kcal,0)/lg.length, diff=avg("kcal")-avgT;
  const proHit=lg.filter(x=>x.tot.p>=x.t.p*0.95).length, calHit=lg.filter(x=>Math.abs(x.tot.kcal-x.t.kcal)<=x.t.kcal*0.07).length;
  const W=520,H=220,pl=8,pb=30,pt=22, mx=Math.max(...days.map(x=>Math.max(x.tot.kcal,x.t.kcal)))*1.12, bw=(W-pl*2)/7;
  const Y=v=>pt+(H-pt-pb)*(1-v/mx); let g="";
  days.forEach((x,i)=>{const cx=pl+bw*i+bw/2, over=x.tot.kcal>x.t.kcal*1.07;
    g+=`<rect x="${cx-bw*0.3}" y="${Y(x.tot.kcal)}" width="${bw*0.6}" height="${Math.max(0,H-pb-Y(x.tot.kcal))}" rx="6" fill="${!x.logged?"var(--surface-2)":over?"var(--bad)":"var(--phase)"}"/>
      <line x1="${cx-bw*0.42}" x2="${cx+bw*0.42}" y1="${Y(x.t.kcal)}" y2="${Y(x.t.kcal)}" stroke="var(--text)" stroke-width="2" stroke-dasharray="4 4" opacity=".7"/>
      ${x.logged?`<text x="${cx}" y="${Y(x.tot.kcal)-6}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)">${R(x.tot.kcal)}</text>`:""}
      <text x="${cx}" y="${H-9}" text-anchor="middle" font-size="13" fill="var(--muted)">${parseYmd(x.d).toLocaleDateString(undefined,{weekday:"short"})}</text>`;});
  let msg;
  if(Math.abs(diff)<=avgT*0.05) msg=`<div class="status good">Averaging ${R(avg("kcal")).toLocaleString()} kcal, right on target.</div>`;
  else if(diff>0) msg=`<div class="status warn">Averaging ${R(diff)} kcal over target. The usual culprits: oil, sauces, drinks and second bowls of rice.</div>`;
  else msg=`<div class="status ${diff<-avgT*0.15?"bad":"good"}">Averaging ${R(-diff)} kcal under target.${diff<-avgT*0.15?" That is too low to keep muscle. Eat closer to your number.":""}</div>`;
  h+=`<div class="stat" style="margin-bottom:12px"><div><b class="num">${R(avg("kcal")).toLocaleString()}</b><span>avg kcal</span></div><div><b class="num">${R(avg("p"))} g</b><span>avg protein</span></div><div><b class="num">${proHit}/${lg.length}</b><span>protein days hit</span></div></div>
    ${msg}<div class="card" style="margin-top:12px"><div class="row between"><div class="label">Calories vs target</div><div class="small muted">- - target</div></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories for the last 7 days">${g}</svg></div>
    <div class="card" style="margin-top:12px"><div class="label" style="margin-bottom:6px">Daily detail</div>${days.slice().reverse().map(x=>`<button class="erow" data-a="goto" data-v="${x.d}"><span><span class="en">${niceDate(x.d)}</span><span class="small muted">${x.logged?R(x.tot.p)+"P "+R(x.tot.c)+"C "+R(x.tot.f)+"F":"Nothing logged"}</span></span><span class="ek"><b class="num">${x.logged?R(x.tot.kcal).toLocaleString():"-"}</b><span class="small muted">of ${x.t.kcal.toLocaleString()}</span></span></button>`).join("")}</div>
    <p class="small muted" style="margin-top:10px">${calHit} of ${lg.length} logged days within 7% of your calorie target.</p>`;
  return h;
}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-a]"); if(!t) return; const a=t.dataset.a, v=t.dataset.v;
  if(a==="bgclose"){if(ev.target===t)closeSheet();return;}
  if(planEvent(a,v,t))return;
  switch(a){
    case "tab": S.tab=v; render(); window.scrollTo(0,0); break;
    case "day": S.date=addDays(S.date,+v); render(); break;
    case "today": S.date=ymd(new Date()); render(); break;
    case "goto": S.date=v; S.tab="today"; render(); window.scrollTo(0,0); break;
    case "settings": sheetSettings(); break;
    case "add": openAdd(v); break;
    case "closeAdd": closeAdd(); break;
    case "cat": S.add.cat=v; renderAdd(); break;
    case "sub": S.add.sub=v; renderAdd(true); break;
    case "fav": {const on=!isFav(v); S.favs=on?[v].concat(S.favs):S.favs.filter(x=>x!==v); save.favs();
      const sh=t.closest(".sheet"); if(sh){t.classList.toggle("on",on);t.textContent=on?"\u2605":"\u2606";}
      if(S.add) renderAdd(true); else if(!sh) render(); else if(S.tab==="foods") render();
      toast(on?"Added to favorites":"Removed from favorites"); break;}
    case "finfo": sheetFoodInfo(v); break;
    case "infoAdd": {const f=foodById(v); if(f) openAmount(f,S.add.meal); break;}
    case "amtBack": renderAmount(); break;
    case "editVals": sheetEditVals(v); break;
    case "saveVals": {const f=foodById(v), g=f.sv[0][1], k=num($("#ev-k").value); if(!(k>0)){toast("Enter the calories");break;}
      S.over[v]={k:k*100/g,p:num($("#ev-p").value)*100/g,c:num($("#ev-c").value)*100/g,f:num($("#ev-f").value)*100/g}; save.over();
      afterValsChange(v,f.name.split(" (")[0]+" now "+R(k)+" kcal per "+f.sv[0][0]); break;}
    case "resetVals": {delete S.over[v]; save.over(); afterValsChange(v,"Back to the original values"); break;}
    case "pick": {const f=S.add.cat==="recent"&&!S.add.q?recentFoods().find(x=>x.id===v):foodById(v); if(f) openAmount(f,S.add.meal); break;}
    case "pickMeal": {const m=mealList().find(x=>x.id===v); if(!m) break; m.items.forEach(i=>{const e=Object.assign({},i);delete e.id;delete e.meal;addEntry(S.date,S.add.meal,e);}); toast(m.name+" added"); closeAdd(); break;}
    case "step": {const A=S.amt, isG=servings(A.f)[A.si][0]==="Grams", st=isG?10:0.5; A.q=Math.max(isG?5:0.25,Math.round((A.q+st*(+v))*100)/100); $("#am-q").value=A.q; updAmount(); break;}
    case "amtSave": {const A=S.amt; if(!(A.q>0)){toast("Enter an amount");break;} const s=servings(A.f)[A.si], e=entryFromFood(A.f,s[1]*A.q,s[0],A.q);
      if(A.custom){Object.assign(e,{kcal:A.custom.kcal,p:A.custom.p,c:A.custom.c,f:A.custom.f,custom:true});}
      if(A.editId){const list=entries(S.date),i=list.findIndex(x=>x.id===A.editId); if(i>=0){list[i]=Object.assign({id:A.editId,meal:list[i].meal},e);save.log();}}

    case "saveMeal": openSheet(`<h2>Save ${esc(v)} as a meal</h2><div class="stack" style="margin-top:12px">${fld("m-name","Meal name","e.g. Weekday chicken pasta")}<button class="btn primary block" data-a="mealSave" data-v="${esc(v)}">Save meal</button></div>`); break;

function ingMacro(n){

  const r=planById(id); if(!r)return; q=q||1; meal=meal||PMEAL[r[3]]; S.rsheet={id,q,meal};
  const m=rMacros(r), inList=S.groc.sel[id], old=$(".sheet"), keep=old&&old.dataset.rid===id?old.scrollTop:0;
  openSheet(`<div class="guide"><h2 style="margin-bottom:2px">${esc(r[1])}</h2><p class="small muted" style="margin:0 0 10px">${r[2]?esc(r[2])+" · ":""}${esc(r[4])}${m.edited?" · <b style='color:var(--warn)'>your edited values</b>":""}</p>
    <div class="row between" style="margin-bottom:10px"><span class="label">Servings</span><div class="row" style="gap:6px"><button class="iconbtn" data-a="rQ" data-v="-1" aria-label="Fewer servings">−</button><b class="num" style="font-size:24px;min-width:28px;text-align:center">${q}</b><button class="iconbtn" data-a="rQ" data-v="1" aria-label="More servings">+</button></div></div>
    ${macroBoxes(m,q)}
    <p class="small muted" style="margin:6px 0 0">${q>1?"Total for "+q+" servings. ":""}Per serving: ${R(m.kcal)} kcal.</p>
    <h3>Ingredients</h3>
    <div class="card" style="padding:4px 14px;background:var(--bg)">${r[6].map(([n,g,hint])=>{const b=BUY[n];return `<div class="ing"><b class="num">${R(g*q)} g</b><span><span>${esc(ingLabel(n))}</span><span class="small muted">${esc(hint||"")}${b?" · about "+R(g*q*b[1])+" g "+b[0]:""}</span></span></div>`;}).join("")}</div>
    <h3>Steps</h3><ol>${r[7].map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
    ${r[8]?`<p class="small" style="margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2)"><b>Tip:</b> ${esc(r[8])}</p>`:""}
    <h3>Log it</h3>
    <div class="seg" style="margin-bottom:8px">${MEALS.map(x=>`<button class="${meal===x?"on":""}" data-a="rMeal" data-v="${x}">${x==="Snacks"?"Snack":x}</button>`).join("")}</div>
    <div class="stack"><button class="btn primary block" data-a="rLogQ">Log ${q} serving${q>1?"s":""} to ${meal.toLowerCase()} · ${R(m.kcal*q)} kcal</button>
    <button class="btn block ${inList?"":"ghost"}" data-a="rListQ">${inList?"Update grocery list to "+q+" serving"+(q>1?"s":""):"Add "+q+" serving"+(q>1?"s":"")+" to grocery list"}</button>
    ${inList?`<button class="btn ghost block" data-a="rUnlist">Remove from grocery list</button>`:""}
    <button class="btn ghost block" data-a="closeSheet">Close</button></div></div>`);
  const sh=$(".sheet"); if(sh){sh.dataset.rid=id; sh.scrollTop=keep;}
}
function grocItems(){
  const items={};
  Object.entries(S.groc.sel).forEach(([id,q])=>{const r=planById(id);if(!r)return;r[6].forEach(([n,g])=>{const k=ingLabel(n).replace(/, cooked| \(raw\)|, dry/,"");(items[k]=items[k]||{n:k,raw:n,g:0,from:[]}).g+=g*q;if(items[k].from.indexOf(r[1])<0)items[k].from.push(r[1]);});});
  return Object.values(items);
}
function grocAmount(it){const b=BUY[it.raw];return b?R(it.g*b[1])+" g "+b[0]+" (makes "+R(it.g)+" g cooked)":R(it.g)+" g";}
function viewGrocery(){
  const sel=Object.entries(S.groc.sel).filter(([id])=>planById(id));
  if(!sel.length) return `<div class="card" style="margin-top:12px"><div class="empty">Your grocery list is empty. Open any recipe and tap <b>+ Grocery list</b>. Pick how many servings you will cook and the grams add up here.</div></div>`;
  const items=grocItems(), got=S.groc.got;
  let h=`<div class="label" style="margin:14px 0 8px">Cooking this week</div><div class="card" style="padding:4px 14px">${sel.map(([id,q])=>{const r=planById(id);return `<div class="ing" style="align-items:center"><span style="flex:1;min-width:0"><span class="en">${esc(r[1])}</span><span class="small muted">${PMEAL[r[3]]} · ${R(rMacros(r).kcal)} kcal each</span></span>
    <div class="row" style="gap:4px;flex:none"><button class="iconbtn sm" data-a="gQ" data-v="${id}|-1" aria-label="Fewer">−</button><b class="num" style="font-size:20px;min-width:22px;text-align:center">${q}</b><button class="iconbtn sm" data-a="gQ" data-v="${id}|1" aria-label="More">+</button></div></div>`;}).join("")}</div>`;
  const left=items.filter(i=>!got[i.n]).length;
  h+=`<div class="row between" style="margin:16px 0 8px"><span class="label">Shopping list · ${left} left</span><button class="btn sm ghost" data-a="gCopy">Copy list</button></div>`;
  AISLES.forEach(a=>{const list=items.filter(i=>aisleOf(i.raw)===a).sort((x,y)=>x.n.localeCompare(y.n)); if(!list.length)return;
    h+=`<div class="small muted" style="margin:10px 2px 4px;font-weight:700;letter-spacing:.04em;text-transform:uppercase">${a}</div><div class="card" style="padding:2px 12px">${list.map(i=>`<button class="gi${got[i.n]?" got":""}" data-a="gGot" data-v="${esc(i.n)}"><span class="ck">${got[i.n]?"✓":""}</span><span style="flex:1;min-width:0;text-align:left"><span class="en">${esc(i.n)}</span><span class="small muted">${esc(i.from.join(", "))}</span></span><b class="num" style="font-size:17px;text-align:right">${esc(grocAmount(i))}</b></button>`).join("")}</div>`;});
  h+=`<div class="stack" style="margin-top:14px"><button class="btn ghost block" data-a="gClearGot">Untick everything</button><button class="btn danger block" data-a="gClear">Clear grocery list</button></div>
    <p class="small muted" style="margin:12px 4px">A Costco rotisserie chicken gives roughly 700 to 800 g of meat. Spices, salt and cooking spray are not listed.</p>`;
  return h;
}
function grocText(){
  const items=grocItems(); let t="Grocery list\n";
  AISLES.forEach(a=>{const list=items.filter(i=>aisleOf(i.raw)===a&&!S.groc.got[i.n]); if(!list.length)return; t+="\n"+a+"\n"+list.map(i=>"- "+i.n+": "+grocAmount(i)).join("\n")+"\n";});
  return t;
}
function logRecipe(id,q,meal){const r=planById(id),f=r&&foodById(r[1]);if(!f)return;const e=entryFromFood(f,100*q,"1 meal",q);addEntry(S.date,meal,e);toast("Logged "+R(e.kcal)+" kcal to "+meal.toLowerCase());}

/* ===================== ADJUSTABLE TARGETS ===================== */
const BLOCKS=[[1,"Weeks 1-5","Foundation"],[6,"Week 6","Refeed week"],[7,"Weeks 7-10","Build"],[11,"Weeks 11-14","Sharpen"],[15,"Week 15","Peak week"],[16,"March","Trip"]];
function blockOf(w){let b=1;BLOCKS.forEach(([k])=>{if(w>=k)b=k;});return b;}
function blockName(k){const b=BLOCKS.find(x=>x[0]===k);return b?b[1]:"";}
function sheetTargets(){
  const d=S.date, t=targets(d), w=weekOf(d), bk=blockOf(w), dayO=(S.settings.dayT||{})[d], blockO=(S.settings.weekT||{})[bk];
  const scope=S.tscope||(dayO?"day":S.settings.mode==="custom"?"all":"block");
  openSheet(`<h2>Targets</h2><p class="small muted" style="margin:0 0 10px">${niceDate(d)}${S.settings.mode==="custom"?" · custom every day":" · "+blockName(bk)}${dayO?" · <b style='color:var(--warn)'>edited for this day</b>":""}</p>
    <div class="stack">
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">${fld("tt-k","Calories","","numeric",t.kcal)}${fld("tt-p","Protein g","","numeric",t.p)}${fld("tt-c","Carbs g","","numeric",t.c)}${fld("tt-f","Fat g","","numeric",t.f)}</div>
    <div class="row between small" style="gap:8px"><span class="muted" id="tt-sum">Macros add up to ${R(t.p*4+t.c*4+t.f*9).toLocaleString()} kcal</span><button class="btn sm ghost" data-a="ttMatch">Use this</button></div>
    <div class="field"><span class="label">Apply to</span><div class="seg">
      <button class="${scope==="day"?"on":""}" data-a="tScope" data-v="day">This day</button>
      <button class="${scope==="block"?"on":""}" data-a="tScope" data-v="block">${S.settings.mode==="custom"?"My plan":blockName(bk)}</button>
      <button class="${scope==="all"?"on":""}" data-a="tScope" data-v="all">Every day</button></div>
      <p class="small muted" style="margin:6px 0 0" id="tt-help">${scopeHelp(scope,bk)}</p></div>
    <button class="btn primary block" data-a="ttSave">Save targets</button>
    ${dayO?`<button class="btn ghost block" data-a="ttResetDay">Undo edit for this day</button>`:""}
    ${blockO&&S.settings.mode!=="custom"?`<button class="btn ghost block" data-a="ttResetBlock">Reset ${blockName(bk)} to the plan</button>`:""}
    <button class="btn ghost block" data-a="planT">See and edit every week</button>
    <button class="btn ghost block" data-a="closeSheet">Cancel</button></div>`);
  S.tscope=scope;
}
function scopeHelp(s,bk){return s==="day"?"Only this date changes. Good for a big dinner out or a refeed day.":s==="block"?(S.settings.mode==="custom"?"Switches back to the plan and changes "+blockName(bk)+" to these numbers.":"Every day in "+blockName(bk)+" uses these numbers. Later weeks still step down."):"Same numbers every day. Turns off the weekly step-down.";}
function sheetPlanT(){
  const wt=getWT();
  openSheet(`<h2>Plan by week</h2><p class="small muted" style="margin:0 0 10px">These step down as the cut goes on. Change any number and save. Week 15 adds 60 g carbs on Friday and Saturday on its own.</p>
    <div class="stack">${BLOCKS.map(([k,l,sub])=>{const v=wt[k];return `<div class="card" style="padding:10px 12px;background:var(--bg)"><div class="row between" style="margin-bottom:6px"><b>${l}</b><span class="small muted">${sub}${(S.settings.weekT||{})[k]?" · edited":""}</span></div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">${["kcal","Protein","Carbs","Fat"].map((n,i)=>`<div class="field"><label class="small muted" for="pw-${k}-${i}">${n}</label><input id="pw-${k}-${i}" inputmode="numeric" value="${v[i]}"></div>`).join("")}</div></div>`;}).join("")}
    <button class="btn primary block" data-a="planSave">Save plan</button>
    <button class="btn ghost block" data-a="planReset">Reset every week to the original plan</button>
    <button class="btn ghost block" data-a="closeSheet">Cancel</button></div>`);
}
function readT(){return [num($("#tt-k").value),num($("#tt-p").value),num($("#tt-c").value),num($("#tt-f").value)].map(R);}
function planEvent(a,v,t){
  switch(a){
    case "rtab": S.rtab=v; render(); window.scrollTo(0,0); return true;
    case "rOpen": sheetRecipe(v); return true;
    case "rLog": {const r=planById(v); logRecipe(v,1,PMEAL[r[3]]); return true;}
    case "rList": {if(S.groc.sel[v])delete S.groc.sel[v]; else {S.groc.sel[v]=1;toast("Added to grocery list");} save.groc(); render(); return true;}
    case "rQ": {const R0=S.rsheet; sheetRecipe(R0.id,Math.max(1,Math.min(10,R0.q+(+v))),R0.meal); return true;}
    case "rMeal": {const R0=S.rsheet; sheetRecipe(R0.id,R0.q,v); return true;}
    case "rLogQ": {const R0=S.rsheet; logRecipe(R0.id,R0.q,R0.meal); closeSheet(); render(); return true;}
    case "rListQ": {const R0=S.rsheet; S.groc.sel[R0.id]=R0.q; save.groc(); toast("Grocery list updated"); closeSheet(); render(); return true;}
    case "rUnlist": {delete S.groc.sel[S.rsheet.id]; save.groc(); closeSheet(); render(); return true;}
    case "gQ": {const [id,d]=v.split("|"); const q=(S.groc.sel[id]||1)+(+d); if(q<1)delete S.groc.sel[id]; else S.groc.sel[id]=Math.min(10,q); save.groc(); render(); return true;}
    case "gGot": {if(S.groc.got[v])delete S.groc.got[v]; else S.groc.got[v]=1; save.groc(); render(); return true;}
    case "gClearGot": S.groc.got={}; save.groc(); render(); return true;
    case "gClear": sheetConfirm("Clear grocery list?","Removes every recipe from the list. Your recipes stay.","Clear",()=>{S.groc={sel:{},got:{}};save.groc();render();}); return true;
    case "gCopy": {const txt=grocText(); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Copied. Paste into Notes or Reminders.")).catch(()=>{openSheet(`<h2>Grocery list</h2><textarea class="ta" readonly>${esc(txt)}</textarea><button class="btn ghost block" style="margin-top:10px" data-a="closeSheet">Close</button>`);}); return true;}
    case "editT": S.tscope=null; sheetTargets(); return true;
    case "tScope": S.tscope=v; t.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===t)); $("#tt-help").textContent=scopeHelp(v,blockOf(weekOf(S.date))); return true;
    case "ttMatch": {const c=readT(); $("#tt-k").value=R(c[1]*4+c[2]*4+c[3]*9); updTSum(); return true;}
    case "ttSave": {const c=readT(); if(!(c[0]>0)){toast("Enter calories");return true;} const st=S.settings, sc=S.tscope;
      if(sc==="day"){st.dayT=Object.assign({},st.dayT||{},{[S.date]:c});}
      else if(sc==="block"){st.mode="auto"; st.weekT=Object.assign({},st.weekT||{},{[blockOf(weekOf(S.date))]:c}); if(st.dayT)delete st.dayT[S.date];}
      else {st.mode="custom"; st.custom=c; if(st.dayT)delete st.dayT[S.date];}
      save.settings(); closeSheet(); render(); toast("Targets saved"); return true;}
    case "ttResetDay": delete S.settings.dayT[S.date]; save.settings(); closeSheet(); render(); toast("Back to the plan for this day"); return true;
    case "ttResetBlock": delete S.settings.weekT[blockOf(weekOf(S.date))]; save.settings(); closeSheet(); render(); toast("Reset to the plan"); return true;
    case "planT": sheetPlanT(); return true;
    case "planSave": {const o={}; BLOCKS.forEach(([k])=>{const c=[0,1,2,3].map(i=>R(num($("#pw-"+k+"-"+i).value))); const d=WEEKT[k]; if(c[0]>0&&c.some((x,i)=>x!==d[i]))o[k]=c;}); S.settings.weekT=o; S.settings.mode="auto"; save.settings(); closeSheet(); render(); toast("Plan saved"); return true;}
    case "planReset": sheetConfirm("Reset the plan?","Every week goes back to the original numbers. Days you edited one by one stay edited.","Reset",()=>{S.settings.weekT={};save.settings();render();toast("Plan reset");}); return true;
  }
  return false;
}
function updTSum(){const c=readT(),el=$("#tt-sum"); if(el)el.textContent="Macros add up to "+R(c[1]*4+c[2]*4+c[3]*9).toLocaleString()+" kcal";}

/* ===================== BOOT ===================== */
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
let lastDay=ymd(new Date());
document.addEventListener("visibilitychange",()=>{if(!document.hidden){const n=ymd(new Date());if(n!==lastDay){if(S.date===lastDay)S.date=n;lastDay=n;}if(!S.add&&!$("#sheet").innerHTML)render();}});
})();

</script>
</body>
</html>
